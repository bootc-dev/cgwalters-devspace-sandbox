            const dest = path.join(STAGED_DIR, name);
            fs.rmSync(dest, { recursive: true, force: true });
            fs.mkdirSync(dest, { mode: 0o755 });
            try {
              copyTree(src, path.join(dest, path.basename(src)));
            } catch (e) {
              fs.rmSync(dest, { recursive: true, force: true });
              throw e;
            }
          }

          let req;
          try {
            req = JSON.parse(fs.readFileSync(0, "utf8"));
          } catch (e) {
            fail(`invalid request: ${e.message}`);
          }
          if (!/^[0-9a-f]{32}$/.test(req.id ?? "")) fail("invalid step id");
          if (typeof req.script !== "string" && typeof req.action !== "object" && typeof req.stage !== "object" && req.seal !== true) fail("missing script");
          const env = req.env ?? {};
          // The environment reaches the step through a file (see LAUNCHER), so
          // values may span lines, and names may have dashes (INPUT_NODE-VERSION).
          const ENV_NAME_RE = /^[A-Za-z_][A-Za-z0-9_-]*$/;
          for (const [k, v] of Object.entries(env)) {
            if (!ENV_NAME_RE.test(k)) fail(`invalid variable name ${JSON.stringify(k)}`);
            if (DENIED_ENV.test(k)) fail(`${k} cannot be passed into the sandbox`);
            if (typeof v !== "string" || v.includes("\0")) fail(`${k}: values must be strings without NUL`);
          }

          // The directory of a fetched action, from a `uses` the request names.
          function actionDir(uses) {
            const m = USES_RE.exec(uses ?? "");
            if (!m) throw new Error(`invalid action ${JSON.stringify(uses)}`);
            const [, owner, repo, sub, sha] = m;
            if (sub.split("/").some((c) => c === "." || c === "..")) throw new Error(`invalid action path in ${uses}`);
            const dir = path.join(ACTIONS_DIR, owner, repo, sha, sub);
            if (!fs.statSync(dir, { throwIfNoEntry: false })?.isDirectory()) throw new Error(`${uses} was not fetched by the enter step`);
            return { dir, repository: `${owner}/${repo}`, ref: sha };
          }

          // A file of an action by its path in action.yml, which must stay inside it.
          function actionFile(dir, rel) {
            if (typeof rel !== "string" || rel === "" || path.isAbsolute(rel) || rel.split("/").some((c) => c === ".." || c === "")) {
              throw new Error(`invalid entry point ${JSON.stringify(rel)}`);
            }
            const file = fs.realpathSync(path.join(dir, rel));
            if (!file.startsWith(`${fs.realpathSync(dir)}/`)) throw new Error(`entry point ${rel} leaves the action`);
            return file;
          }

          const STATE_KEY_RE = /^[A-Za-z0-9_-]{1,100}$/;

          function readEnvStore() {
            return fs.existsSync(ENV_STORE) ? JSON.parse(fs.readFileSync(ENV_STORE, "utf8")) : { env: {}, path: [] };
          }

          // Applies what a step wrote to GITHUB_ENV and GITHUB_PATH to the store
          // that later sandboxed steps start from. The values are the sandbox's own
          // business, but the names the wrapper sets itself are refused.
          function updateEnvStore(envText, pathText) {
            const store = readEnvStore();
            for (const [k, v] of parseFileCommand(envText, "GITHUB_ENV")) {
              if (DENIED_ENV.test(k)) throw new Error(`GITHUB_ENV: ${k} cannot be set in the sandbox`);
              store.env[k] = v;
            }
            for (const line of pathText.split("\n").map((l) => l.replace(/\r$/, "")).filter(Boolean)) {
              if (!path.isAbsolute(line) || line.includes(":")) throw new Error(`GITHUB_PATH: refusing ${JSON.stringify(line.slice(0, 80))}: must be an absolute path without ':'`);
              store.path = [line, ...store.path.filter((p) => p !== line)];
            }
            fs.writeFileSync(`${ENV_STORE}.tmp`, JSON.stringify(store), { mode: 0o600 });
            fs.renameSync(`${ENV_STORE}.tmp`, ENV_STORE);
          }

          // pam_systemd moves each step into a session scope, which outlives the
          // service when the step leaves a process behind, and the user's systemd
          // manager can run more. Stopping the user's slice ends all of them, and
          // systemctl waits until they are gone. It runs before each step too, for a
          // step whose run.cjs was killed (a timeout, a cancel) before it got to
          // stop its own; cron, at and lingering are denied to the sandbox user, so
          // nothing can start its processes outside a step.
          function stopSandboxProcesses() {
            const r = spawnSync("systemctl", ["stop", `user-${CONFIG.uid}.slice`], { stdio: ["ignore", "inherit", "inherit"] });
            return r.status === 0 ? null : `could not stop the sandbox user's processes (${r.error ?? `exit ${r.status}`})`;
          }

          // The ids the sandbox's files can have: its own, and the subordinate ids
          // rootless podman maps its containers to (`podman unshare chown 1:1 f`
          // makes a file owned by one of them).
          function sandboxIds(file, id) {
            const ranges = [[id, 1]];
            const text = fs.existsSync(file) ? fs.readFileSync(file, "utf8") : "";
            for (const line of text.split("\n")) {
              const [owner, start, count] = line.split(":");
              if (owner === CONFIG.user || owner === String(id)) ranges.push([Number(start), Number(count)]);
            }
            return (n) => ranges.some(([start, count]) => n >= start && n < start + count);
          }

          // World-writable directories (sticky or not) on every mounted filesystem
          // but the kernel's own. Throws if one can't be searched: a seal that
          // misses a directory would leave its files to runner.
          function worldWritableDirs() {
            const mounts = fs.readFileSync("/proc/self/mounts", "utf8").split("\n")
              .map((l) => l.split(" "))
              .filter((f) => f.length > 2 && !KERNEL_FSTYPES.has(f[2]))
              .map((f) => f[1].replace(/\\040/g, " "));
            const dirs = new Set();
            for (const top of new Set(["/", ...mounts])) {
              const r = spawnSync("find", [top, "-xdev", "-type", "d", "-perm", "-0002", "-print0"], { encoding: "utf8", maxBuffer: 1 << 28, stdio: ["ignore", "pipe", "pipe"] });
              // Entries that vanish during the search (a process's /run files) are
              // not a reason to fail; anything else, or a truncated output, is.
              const problems = (r.stderr ?? "").split("\n").filter((l) => l && !l.endsWith("No such file or directory"));
              if (r.error || r.signal || (r.status !== 0 && problems.length)) {
                throw new Error(`searching ${top} for world-writable directories failed (${r.error?.message ?? r.signal ?? problems.join("; ").slice(0, 300)})`);
              }
              for (const d of r.stdout.split("\0").filter(Boolean)) dirs.add(d);
            }
            return [...dirs];
          }

          // Stops the sandbox for good: its processes, and runner's access to
          // whatever it left behind, so publish steps can only read staged outputs.
          function seal() {
            fs.writeFileSync(SEALED, "", { mode: 0o644 });
            // What the sandbox set for its own later steps, and its actions' state.
            fs.rmSync(ENV_STORE, { force: true });
            fs.rmSync(STATE_DIR, { recursive: true, force: true });
            // /var/lib/runner-sandbox (root's) holds the workspace; the home is the
            // sandbox user's.
            for (const dir of [path.dirname(CONFIG.workdir), CONFIG.home]) fs.chmodSync(dir, 0o700);
            const isUid = sandboxIds("/etc/subuid", CONFIG.uid);
            const isGid = sandboxIds("/etc/subgid", CONFIG.gid);
            const removed = [];
            for (const dir of worldWritableDirs()) {
              for (const entry of fs.readdirSync(dir)) {
                const p = path.join(dir, entry);
                const st = fs.lstatSync(p, { throwIfNoEntry: false });
                if (st && (isUid(st.uid) || isGid(st.gid))) {
                  fs.rmSync(p, { recursive: true, force: true });
                  removed.push(p);
                }
              }
            }
            console.log(`Sealed the sandbox${removed.length ? `; removed what it left in ${removed.join(", ")}` : ""}`);
          }

          function writeResult(result) {
            fs.writeFileSync(path.join(RESULTS_DIR, `${req.id}.json`), JSON.stringify(result), { mode: 0o644, flag: "wx" });
          }

          const user = CONFIG.user;
          if (fs.existsSync(SEALED)) {
            writeResult({ status: 125, error: "the sandbox is sealed: no sandboxed step can run after the seal step" });
            process.exit(125);
          }
          const stopError = stopSandboxProcesses();
          if (stopError) fail(stopError);
          if (req.stage || req.seal) {
            let result = { status: 0, output: "", summary: "" };
            try {
              if (req.stage) stage(req.stage);
              else seal();
            } catch (e) {
              result = { status: 1, error: `${req.stage ? "stage" : "seal"}: ${e.message}` };
            }
            writeResult(result);
            process.exit(result.status);
          }
          const stepDir = path.join(STEPS_DIR, req.id);
          const outDir = path.join(stepDir, "out");
          fs.mkdirSync(stepDir, { mode: 0o755 }); // fails if the id was used before
          fs.mkdirSync(outDir, { mode: 0o700 });
          fs.chownSync(outDir, CONFIG.uid, CONFIG.gid);
          const FILES = { output: "GITHUB_OUTPUT", env: "GITHUB_ENV", path: "GITHUB_PATH", state: "GITHUB_STATE", summary: "GITHUB_STEP_SUMMARY" };
          // @actions/core refuses to write to a file command that doesn't exist, as
          // the runner always creates them.
          for (const f of Object.keys(FILES)) {
            const file = path.join(outDir, f);
            fs.writeFileSync(file, "", { mode: 0o600, flag: "wx" });
            fs.chownSync(file, CONFIG.uid, CONFIG.gid);
          }

          let action = null;
          let stateKey = null;
          try {
            if (req.action) {
              action = actionDir(req.action.uses);
              action.entry = actionFile(action.dir, req.action.entry);
              stateKey = req.action.stateKey ?? null;
              if (stateKey !== null && !STATE_KEY_RE.test(stateKey)) throw new Error(`invalid state key ${JSON.stringify(stateKey)}`);
            } else if (req.actionPath !== undefined) {
              action = actionDir(req.actionPath);
            }
          } catch (e) {
            fs.rmSync(stepDir, { recursive: true, force: true });
            writeResult({ status: 125, error: e.message });
            process.exit(125);
          }

          const store = readEnvStore();
          const state = stateKey && fs.existsSync(path.join(STATE_DIR, `${stateKey}.json`))
            ? JSON.parse(fs.readFileSync(path.join(STATE_DIR, `${stateKey}.json`), "utf8"))
            : {};
          const vars = {
            ...store.env,
            ...Object.fromEntries(Object.entries(state).map(([k, v]) => [`STATE_${k}`, v])),
            ...env,
            LANG: "C.UTF-8",
            PATH: [...store.path, SANDBOX_PATH].join(":"),
            GITHUB_WORKSPACE: CONFIG.workdir,
            RUNNER_TEMP: CONFIG.tempdir,
            RUNNER_TOOL_CACHE: CONFIG.toolcache,
            RUNNER_OS: "Linux",
            RUNNER_ARCH,
            ...(action ? { GITHUB_ACTION_PATH: action.dir, GITHUB_ACTION_REPOSITORY: action.repository, GITHUB_ACTION_REF: action.ref } : {}),
            ...Object.fromEntries(Object.entries(FILES).map(([f, name]) => [name, path.join(outDir, f)])),
          };
          const envFile = path.join(stepDir, "env.json");
          // Readable by the sandbox, which starts with it, and not by runner.
          fs.writeFileSync(envFile, JSON.stringify(vars), { mode: 0o640 });
          fs.chownSync(envFile, 0, CONFIG.gid);
          let command;
          if (req.action) {
            command = [LAUNCHER, envFile, "node", action.entry];
          } else {
            fs.writeFileSync(path.join(stepDir, "script.sh"), req.script, { mode: 0o644 });
            command = [LAUNCHER, envFile, "/bin/bash", "--noprofile", "--norc", "-e", "-o", "pipefail", path.join(stepDir, "script.sh")];
          }
          // run0 starts the script as a transient service through its own PAM stack
          // (no pam_env), so pam_systemd gives it a logind session like an SSH login
          // gets: XDG_RUNTIME_DIR and the user's systemd manager, which rootless
          // podman needs. It sets HOME, USER, LOGNAME and SHELL for the sandbox user
          // itself. It also sets SUDO_USER and friends as sudo would, which tools
          // take to mean they run under sudo, and --setenv can't unset them, hence
          // the env -u. Unlike systemd-run --collect, run0 would leave a failed unit
          // behind for every step that fails, so collect those too.
          const argv = [
            "--pipe", "--no-ask-password", "--shell-prompt-prefix=", `--user=${user}`, `--chdir=${CONFIG.workdir}`,
            "--property=CollectMode=inactive-or-failed",
            // The sandbox gets its own /tmp, so it can't leave files there for the
            // runner's later steps; the runner's home is hidden outright.
            "--property=PrivateTmp=yes", `--property=InaccessiblePaths=-${CONFIG.runnerHome}`,
            `--setenv=LANG=${vars.LANG}`, `--setenv=PATH=${vars.PATH}`,
            "--", "env", ...SUDO_VARS.flatMap((v) => ["-u", v]), "--",
            ...command,
          ];
          // Runs run0 with ARGV, passing on its output through a CommandFilter per
          // stream, and resolves to its exit status. run0 hands stdio to PID 1 over
          // D-Bus, which accepts pipes but not every file type, so its stdin is an
          // empty pipe rather than /dev/null.
          function runFiltered(args) {
            return new Promise((resolve) => {
              const child = spawn("run0", args, { stdio: ["pipe", "pipe", "pipe"] });
              child.stdin.end();
              for (const [from, to] of [[child.stdout, process.stdout], [child.stderr, process.stderr]]) {
                const filter = new CommandFilter();
                from.on("data", (chunk) => to.write(filter.push(chunk)));
                from.on("end", () => to.write(filter.end()));
              }
              child.on("error", (e) => {
                console.error(`runner-sandbox-run: run0: ${e.message}`);
                resolve(125);
              });
              child.on("close", (code) => resolve(code ?? 125));
            });
          }

          (async () => {
            const status = await runFiltered(argv);

            // Every process of the step is gone after this, so none can touch the
            // files read below.
            const stopAfter = stopSandboxProcesses();
            let result;
            try {
              if (stopAfter) throw new Error(stopAfter);
              const read = Object.fromEntries(Object.keys(FILES).map((f) => [f, readSandboxFile(path.join(outDir, f))]));
              updateEnvStore(read.env, read.path);
              if (stateKey !== null) {
                const saved = Object.fromEntries(parseFileCommand(read.state, "GITHUB_STATE"));
                fs.mkdirSync(STATE_DIR, { recursive: true, mode: 0o700 });
                fs.writeFileSync(path.join(STATE_DIR, `${stateKey}.json`), JSON.stringify({ ...state, ...saved }), { mode: 0o600 });
              }
              result = { status, output: read.output, summary: read.summary };
            } catch (e) {
              result = { status: 125, error: e.message };
            }
            fs.rmSync(stepDir, { recursive: true, force: true });
            writeResult(result);
            process.exitCode = result.status;
          })();
      name: Enter the sandbox (generated)
      run: |
        const CONFIG = {
          "handoff": {
            "include": [],
            "workspace": "none"
          },
          "lockRunnerSudo": true,
          "user": "runner-sandbox",
          "workspace": "${{ github.workspace }}"
        };
        // The compiler-generated "enter the sandbox" step, run as root (`sudo node`)
        // right after the job's runner_steps. The compiler prepends
        // `const CONFIG = {...};` to this file and passes the two halves of the step
        // wrapper as RUNNER_SANDBOX_EXEC_JS and RUNNER_SANDBOX_RUN_JS, the
        // workspace hand-off (handoff.cjs) as RUNNER_SANDBOX_HANDOFF_JS, and the
        // file command parser and step launcher they use as
        // RUNNER_SANDBOX_FILECMD_JS and RUNNER_SANDBOX_LAUNCH_JS.
        //
        // It creates the sandbox user, hands it the workspace, installs
        // the two halves of the step wrapper, and (with CONFIG.lockRunnerSudo) takes
        // root away from the runner user, whose only remaining sudo rule is the
        // wrapper. From here on, the job's run steps execute as the sandbox user.
        const fs = require("node:fs");
        const path = require("node:path");
        const { spawnSync } = require("node:child_process");

        const CONFIG_DIR = "/etc/runner-sandbox";
        const EXEC = "/usr/local/bin/runner-sandbox-exec";
        const RUN = "/usr/local/libexec/runner-sandbox-run";
        const SUDOERS = "/etc/sudoers.d/zz-runner-sandbox";
        const WORKDIR = "/var/lib/runner-sandbox/work";
        // The sandbox's RUNNER_TEMP and RUNNER_TOOL_CACHE, for the actions it runs.
        const TEMPDIR = "/var/lib/runner-sandbox/temp";
        const TOOLCACHE = "/var/lib/runner-sandbox/toolcache";
        const FILECMD = "/usr/local/libexec/runner-sandbox-filecmd.cjs";
        const LAUNCHER = "/usr/local/libexec/runner-sandbox-launch";
        const DOCKER_UNITS = ["docker.socket", "docker.service", "containerd.service"];

        function run(cmd, args, { check = true } = {}) {
          const r = spawnSync(cmd, args, { encoding: "utf8", stdio: ["ignore", "pipe", "inherit"] });
          if (check && r.status !== 0) throw new Error(`${cmd} ${args.join(" ")} failed (${r.error ?? `exit ${r.status}`})`);
          return { status: r.status, stdout: (r.stdout ?? "").trim() };
        }

        function passwd(name) {
          const [, , uid, gid, , home] = run("getent", ["passwd", name]).stdout.split(":");
          return { uid: Number(uid), gid: Number(gid), home };
        }

        if (process.getuid() !== 0) throw new Error("must run as root");
        // Sandboxed steps run through run0 (systemd 256 or later): ubuntu-26.04 and
        // RHEL 10 have it, ubuntu-24.04 (systemd 255) does not.
        if (run("sh", ["-c", "command -v run0"], { check: false }).status !== 0) {
          throw new Error("run0 not found: sandboxed steps need systemd 256 or later (e.g. runs-on: ubuntu-26.04)");
        }
        const runner = process.env.SUDO_USER;
        if (!runner || runner === "root") throw new Error("must be started with sudo by the runner user");
        const user = CONFIG.user;
        if (user === runner || user === "root") throw new Error(`the sandbox user can't be ${user}: it must be another user than the runner and root`);

        // A runner that ran a job before would hand this one the previous job's
        // sandbox and workspace: refuse it. (The user itself may come with the
        // image, as on the devspace runners.)
        if (fs.existsSync(path.dirname(WORKDIR))) {
          throw new Error(`${path.dirname(WORKDIR)} already exists: the sandbox needs a fresh, ephemeral runner`);
        }
        if (run("getent", ["passwd", user], { check: false }).status !== 0) {
          run("useradd", ["--create-home", "--user-group", "--shell", "/bin/bash", user]);
        }
        const sandbox = passwd(user);
        const runnerHome = passwd(runner).home;
        // Also by uid: another name for root or the runner is still them.
        if (sandbox.uid === 0 || sandbox.uid === passwd(runner).uid) {
          throw new Error(`the sandbox user ${user} has uid ${sandbox.uid}, root's or the runner's`);
        }

        fs.mkdirSync(CONFIG_DIR, { recursive: true, mode: 0o755 });
        // The sandbox works on its own copy of what the job hands it (the files git
        // tracks, by default); the runner's home, which holds the runner's
        // credentials and the job's temp files, is closed.
        const HANDOFF = `${CONFIG_DIR}/handoff.cjs`;
        fs.writeFileSync(HANDOFF, process.env.RUNNER_SANDBOX_HANDOFF_JS ?? "", { mode: 0o644 });
        const { handoff } = require(HANDOFF);
        const copied = handoff({
          workspace: CONFIG.workspace,
          dest: WORKDIR,
          mode: CONFIG.handoff.workspace,
          include: CONFIG.handoff.include,
          owner: sandbox,
          // As runner, whose checkout it is: git as root would read the runner's
          // repository configuration.
          listTracked: () => {
            const r = spawnSync("runuser", ["-u", runner, "--", "git", "-C", CONFIG.workspace, "ls-files", "-z", "-s"], { encoding: "utf8", maxBuffer: 1 << 30 });
            if (r.status !== 0) throw new Error(`handoff.workspace = 'tracked needs a git checkout in ${CONFIG.workspace} (use 'all or 'none otherwise): ${(r.stderr ?? "").trim()}`);
            return r.stdout;
          },
        });
        console.log(`Handed ${copied} workspace entries (${CONFIG.handoff.workspace}) to ${user} in ${WORKDIR}`);
        fs.chmodSync(runnerHome, 0o700);
        for (const d of [TEMPDIR, TOOLCACHE]) {
          fs.mkdirSync(d, { mode: 0o755 });
          fs.chownSync(d, sandbox.uid, sandbox.gid);
        }

        fs.writeFileSync(`${CONFIG_DIR}/config.json`, JSON.stringify({ user, ...sandbox, workdir: WORKDIR, tempdir: TEMPDIR, toolcache: TOOLCACHE, runnerHome }), { mode: 0o644 });
        // runner-sandbox-run runs as root under this node, through the one sudo
        // rule runner keeps, so the binary and every directory above it must be
        // root's alone: a runner-owned node, as in a tool cache, would give runner
        // root.
        const node = fs.realpathSync(process.execPath);
        for (let p = node; ; p = path.dirname(p)) {
          const st = fs.statSync(p);
          if (st.uid !== 0 || st.mode & 0o002 || (st.mode & 0o020 && st.gid !== 0)) {
            throw new Error(`${p} must be owned by root and writable only by root: the step wrapper runs as root under ${node}`);
          }
          if (p === "/") break;
        }
        fs.mkdirSync("/usr/local/libexec", { recursive: true });
        for (const [dest, text, shebang] of [
          [EXEC, process.env.RUNNER_SANDBOX_EXEC_JS, true],
          [RUN, process.env.RUNNER_SANDBOX_RUN_JS, true],
          [LAUNCHER, process.env.RUNNER_SANDBOX_LAUNCH_JS, true],
          [FILECMD, process.env.RUNNER_SANDBOX_FILECMD_JS, false],
        ]) {
          if (!text) throw new Error(`nothing to install at ${dest}`);
          fs.writeFileSync(dest, shebang ? `#!${node}\n${text}` : text, { mode: 0o755 });
          fs.chmodSync(dest, shebang ? 0o755 : 0o644);
        }
        for (const d of ["/run/runner-sandbox/steps", "/run/runner-sandbox/results", "/run/runner-sandbox/staged"]) {
          fs.mkdirSync(d, { recursive: true, mode: 0o755 });
        }

        // Nothing may start the sandbox user's processes outside a step, where the
        // wrapper can't stop them: no cron, no at, no lingering user manager (whose
        // polkit action, like every other, is denied to it below).
        for (const deny of ["/etc/cron.deny", "/etc/at.deny"]) {
          const lines = fs.existsSync(deny) ? fs.readFileSync(deny, "utf8").split("\n") : [];
          if (!lines.includes(user)) fs.appendFileSync(deny, `${user}\n`, { mode: 0o600 });
        }
        run("loginctl", ["disable-linger", user]);
        if (fs.existsSync("/etc/polkit-1")) {
          fs.mkdirSync("/etc/polkit-1/rules.d", { recursive: true, mode: 0o755 });
          fs.writeFileSync("/etc/polkit-1/rules.d/00-runner-sandbox.rules", `polkit.addRule(function(action, subject) {
          if (subject.user == ${JSON.stringify(user)}) return polkit.Result.NO;
        });
        `, { mode: 0o644 });
        }

        // The last matching sudoers rule wins, and this file is read last.
        let sudoers = `${user} ALL=(ALL:ALL) !ALL\n`;
        if (CONFIG.lockRunnerSudo) {
          sudoers += `${runner} ALL=(ALL:ALL) !ALL\n${runner} ALL=(root) NOPASSWD: ${RUN} ""\n`;
        }
        fs.writeFileSync(`${SUDOERS}.tmp`, sudoers, { mode: 0o440 });
        run("visudo", ["-cq", "-f", `${SUDOERS}.tmp`]);
        fs.renameSync(`${SUDOERS}.tmp`, SUDOERS);

        if (CONFIG.lockRunnerSudo) {
          // The runner user is in the docker group, and processes the runner
          // already started keep that group; a daemon that isn't running can't
          // be asked for a root container.
          const present = DOCKER_UNITS.filter((u) => run("systemctl", ["cat", u], { check: false }).status === 0);
          if (present.length) run("systemctl", ["stop", ...present]);
          // Fail closed: the runner must have lost root, and kept only the wrapper.
          if (run("runuser", ["-u", runner, "--", "sudo", "-n", "true"], { check: false }).status === 0) {
            throw new Error(`${runner} still has sudo after the lock`);
          }
          run("runuser", ["-u", runner, "--", "sudo", "-n", "-l", RUN]);
        }
        console.log(`Entered the sandbox: later run steps execute as ${user} (uid ${sandbox.uid}) in ${WORKDIR}`);
        console.log(run("sudo", ["-l", "-U", runner]).stdout);
      shell: sudo --preserve-env=RUNNER_SANDBOX_EXEC_JS,RUNNER_SANDBOX_RUN_JS,RUNNER_SANDBOX_HANDOFF_JS,RUNNER_SANDBOX_FILECMD_JS,RUNNER_SANDBOX_LAUNCH_JS node {0}
    - name: Validate the proposals
      run: node /etc/agent-share/validate.cjs /etc/agent-share/safe-outputs-config.json /etc/agent-share/proposals validated
      shell: /usr/local/bin/runner-sandbox-exec {0}
    - id: stage-safe-outputs-validated
      name: Stage validated as safe-outputs-validated (generated)
      run: /usr/local/bin/runner-sandbox-exec --stage safe-outputs-validated validated
      shell: bash
    - id: runner-sandbox-seal
      if: always()
      name: Seal the sandbox (generated)
      run: /usr/local/bin/runner-sandbox-exec --seal
      shell: bash
    - if: '!cancelled() && steps.stage-safe-outputs-validated.outcome == ''success'' && steps.runner-sandbox-seal.outcome == ''success'''
      name: Upload safe-outputs-validated (generated)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        if-no-files-found: error
        name: safe-outputs-validated
        path: /run/runner-sandbox/staged/safe-outputs-validated
    - env:
        GITHUB_TOKEN: ${{ github.token }}
      if: (success()) && steps.runner-sandbox-seal.outcome == 'success'
      name: Apply the validated outputs
      run: node /etc/agent-share/apply.cjs /etc/agent-share/safe-outputs-config.json /run/runner-sandbox/staged/safe-outputs-validated/validated/validated.json
    timeout-minutes: 10
name: Safe outputs demo
on:
  push:
    branches:
    - wfc-spike
    paths:
    - .github/workflows/safe-outputs-demo.lock.yml
  workflow_dispatch:
