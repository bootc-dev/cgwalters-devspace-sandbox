          }

          // A relative path within the workspace: no leading /, no . or .. component.
          function checkRelative(rel) {
            if (typeof rel !== "string" || rel === "" || path.isAbsolute(rel) || rel.split("/").some((c) => c === "" || c === "." || c === "..")) {
