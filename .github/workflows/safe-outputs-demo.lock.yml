            }
          ]
        name: agent-session.json
    - name: Share agent-agents.toml as /etc/agent-share/agent-agents.toml (generated)
      uses: cgwalters-forge/actions/sandbox-share@f1cc343b8404c22aadbc8c5a7d0923dae4015179
      with:
        content: |-
          [fake]
          command = ["fake-acp-agent", "script", "/etc/agent-share/agent-session.json"]
        name: agent-agents.toml
    - env:
        HARNESS_REPO: cgwalters-forge/cgwalters-devspace-sandbox
        HARNESS_SHA: 13308dc5480bc9f89dbf4b9abfabc7972222db8e
        HARNESS_SHARE: /usr/local/share/bot-harness
      name: Build bot-harness at a pinned commit
      run: |
        # agent-run: Build bot-harness at a pinned commit
        # shellcheck shell=bash
        set -euo pipefail
        src="$RUNNER_TEMP/bot-harness"
        git init -q "$src"
        git -C "$src" fetch -q --depth 1 "https://github.com/$HARNESS_REPO" "$HARNESS_SHA"
        git -C "$src" -c advice.detachedHead=false checkout -q FETCH_HEAD
        test "$(git -C "$src" rev-parse HEAD)" = "$HARNESS_SHA"
        cargo build --manifest-path "$src/Cargo.toml" --release --locked -p bot-harness
        sudo install -m 0755 "$src/target/release/bot-harness" "$src/target/release/fake-acp-agent" /usr/local/bin/
        sudo install -d -m 0755 "$HARNESS_SHARE"
        sudo install -m 0644 "$src/agent/redact.mjs" "$HARNESS_SHARE/"
      shell: bash
    - name: Share task as /etc/agent-share/task (generated)
      uses: cgwalters-forge/actions/sandbox-share@f1cc343b8404c22aadbc8c5a7d0923dae4015179
      with:
        content: ${{ inputs.task || 'Say hello on the demo issue.' }}
        name: task
    - name: Secure the host (generated)
      run: |
        // The compiler-generated "secure the host" step, run as root (`sudo node`)
        // before the job enters the sandbox. It closes what runner images leave
        // open to every local user, which stops mattering only once some steps
        // run as a user other than runner. These are the image fixes from
        // cgwalters-devspace-sandbox's setup-runner-sandbox.mjs, for images like
        // the RHEL runners that are built with umask 000.
        //
        // TODO: replace this step with cgwalters-forge/actions/secure-host-setup,
        // pinned by commit, once it exists.
        "use strict";
        const fs = require("node:fs");
        const { spawnSync } = require("node:child_process");

        // The runner's .credentials and the hosted compute agent's token
        // (/opt/hca/.settings, RHEL runners only) are world-readable there.
        const PRIVATE_DIRS = ["/home/runner", "/opt/hca"];
        // Sticky world-writable directories, meant to stay that way.
        const SHARED_TMP = ["/tmp", "/var/tmp"];
        // Some images set XDG_RUNTIME_DIR to runner's here, and PAM hands it to
        // every session, which breaks other users' session bus and rootless podman.
        // https://github.com/actions/runner-images/issues/14649
        const ENVIRONMENT = "/etc/environment";
        const IMAGE_ENV_VARS = ["XDG_RUNTIME_DIR"];

        function run(cmd, args) {
          const r = spawnSync(cmd, args, { encoding: "utf8", stdio: ["ignore", "pipe", "inherit"], maxBuffer: 1 << 28 });
          if (r.status !== 0) throw new Error(`${cmd} ${args.join(" ")} failed (${r.error ?? `exit ${r.status}`})`);
          return r.stdout.trim();
        }

        if (process.getuid() !== 0) throw new Error("must run as root");

        for (const dir of PRIVATE_DIRS.filter((d) => fs.existsSync(d))) {
          fs.chmodSync(dir, 0o700);
        }

        // World-writable system files include ones root loads code from (a polkit
        // rule, a unit): any user could make itself root through them.
        const prune = SHARED_TMP.flatMap((d) => ["-path", d, "-o"]);
        const fixed = run("find", ["/", "-xdev", "(", ...prune, "-false", ")", "-prune", "-o",
          "(", "-type", "f", "-o", "-type", "d", ")", "-perm", "-0002", "!", "-perm", "-1000",
          "-print", "-exec", "chmod", "o-w", "{}", "+"]);
        const paths = fixed ? fixed.split("\n") : [];
        console.log(`Removed world write access from ${paths.length} paths${paths.length ? `, such as:\n  ${paths.slice(0, 10).join("\n  ")}` : ""}`);

        if (fs.existsSync(ENVIRONMENT)) {
          const lines = fs.readFileSync(ENVIRONMENT, "utf8").split("\n");
          const kept = lines.filter((l) => !IMAGE_ENV_VARS.some((v) => l.trim().startsWith(`${v}=`)));
          if (kept.length !== lines.length) {
            const tmp = `${ENVIRONMENT}.secure-host`;
            fs.writeFileSync(tmp, kept.join("\n"), { mode: fs.statSync(ENVIRONMENT).mode & 0o7777 });
            fs.renameSync(tmp, ENVIRONMENT);
            // SELinux (RHEL): give the new file the label of the one it replaced.
            if (spawnSync("sh", ["-c", "command -v restorecon"], { stdio: "ignore" }).status === 0) run("restorecon", [ENVIRONMENT]);
            console.log(`Dropped ${IMAGE_ENV_VARS.join(", ")} from ${ENVIRONMENT}`);
          }
        }

        // Hardening only (the uid split is the boundary): some images let any
        // process attach to any other of its uid.
        fs.writeFileSync("/proc/sys/kernel/yama/ptrace_scope", "1\n");
      shell: sudo node {0}
    - env:
        RUNNER_SANDBOX_EXEC_JS: |
          // Runner side of a sandboxed step, used as its shell
          // (`shell: /usr/local/bin/runner-sandbox-exec {0}`). It runs as the runner
          // user, which holds the job's credentials, so it passes along only the step
          // script, the variables the compiler listed in RUNNER_SANDBOX_ENV and a
          // fixed set of non-secret context variables, and asks runner-sandbox-run
          // (through sudo) to run the script as the sandbox user. Afterwards it copies
          // the step's outputs and summary into the runner's own files, checking the
          // output names.
          //
          // `runner-sandbox-exec --action SPEC` runs a JavaScript action in the
          // sandbox instead: SPEC is the file the runner wrote from the step's
          // `run:`, the JSON {uses, entry, stateKey} the compiler generated, and
          // the action's inputs are in the step's env. `runner-sandbox-exec
          // --action-path USES SCRIPT` runs a `run:` step of the composite action
          // USES. `runner-sandbox-exec --stage NAME PATH` has the root side copy
          // PATH out of the sandbox for a generated stage step, and
          // `runner-sandbox-exec --seal` has it seal the sandbox after the last
          // sandboxed step.
          //
          // Outputs come back as name=value lines or in the heredoc form, and are
          // written to the runner's GITHUB_OUTPUT re-encoded with a delimiter of
          // this side's choosing (filecmd.cjs).
          "use strict";
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { spawnSync } = require("node:child_process");
          const { parse, format, neutralize } = require("/usr/local/libexec/runner-sandbox-filecmd.cjs");

          const RUN = "/usr/local/libexec/runner-sandbox-run";
          const SUDO = "/usr/bin/sudo";
          const RESULTS_DIR = "/run/runner-sandbox/results";
          const CONTEXT_ENV = [
            "CI", "GITHUB_ACTIONS", "GITHUB_ACTOR", "GITHUB_EVENT_NAME", "GITHUB_JOB", "GITHUB_REF", "GITHUB_REF_NAME",
            "GITHUB_REPOSITORY", "GITHUB_RUN_ATTEMPT", "GITHUB_RUN_ID", "GITHUB_SERVER_URL", "GITHUB_SHA", "GITHUB_WORKFLOW",
          ];
          const USAGE = "usage: runner-sandbox-exec SCRIPT | --action SPEC | --action-path USES SCRIPT | --stage NAME PATH | --seal";

          // MESSAGE can quote what the sandbox wrote, so its lines go through the
          // same filter as the sandbox's own output.
          function fail(message) {
            console.error(String(message).split(/\r\n|\r|\n/).map((l) => neutralize(`runner-sandbox-exec: ${l}`)).join("\n"));
            process.exit(125);
          }

          const args = process.argv.slice(2);
          const ARGC = { "--action": 2, "--action-path": 3, "--stage": 3, "--seal": 1 };
          if (args.length === 0 || args.length !== (ARGC[args[0]] ?? (args[0].startsWith("--") ? -1 : 1))) fail(USAGE);
          const names = (process.env.RUNNER_SANDBOX_ENV ?? "").split(",").filter(Boolean);
          const env = {};
          for (const name of [...CONTEXT_ENV, ...names]) {
            if (process.env[name] !== undefined) env[name] = process.env[name];
          }
          // A step generated from an action has its env under fixed names, so the
          // action's own names never apply to this process; they come back here.
          const mapped = (process.env.RUNNER_SANDBOX_ENV_NAMES ?? "").split(",").filter(Boolean);
          mapped.forEach((name, i) => {
            const value = process.env[`RUNNER_SANDBOX_VAR_${i}`];
            if (value !== undefined) env[name] = value;
          });
          const id = crypto.randomBytes(16).toString("hex");
          let request;
          switch (args[0]) {
            case "--stage":
              request = { id, stage: { name: args[1], path: args[2] } };
              break;
            case "--seal":
              request = { id, seal: true };
              break;
            case "--action": {
              let spec;
              try {
                spec = JSON.parse(fs.readFileSync(args[1], "utf8"));
              } catch (e) {
                fail(`invalid action spec: ${e.message}`);
              }
              request = { id, action: { uses: spec.uses, entry: spec.entry, stateKey: spec.stateKey }, env };
              break;
            }
            case "--action-path":
              request = { id, script: fs.readFileSync(args[2], "utf8"), env, actionPath: args[1] };
              break;
            default:
              request = { id, script: fs.readFileSync(args[0], "utf8"), env };
          }
          // By absolute path: the step's own env: applies to this process.
          const r = spawnSync(SUDO, ["-n", RUN], { input: JSON.stringify(request), stdio: ["pipe", "inherit", "inherit"] });
          if (r.error) fail(`running ${RUN}: ${r.error.message}`);

          let result;
          try {
            result = JSON.parse(fs.readFileSync(`${RESULTS_DIR}/${id}.json`, "utf8"));
          } catch (e) {
            fail(`no result from the sandbox (exit ${r.status}): ${e.message}`);
          }
          if (result.error) fail(result.error);
          let outputs;
          try {
            outputs = parse(result.output, "GITHUB_OUTPUT");
          } catch (e) {
            fail(e.message);
          }
          if (outputs.length) fs.appendFileSync(process.env.GITHUB_OUTPUT, outputs.map(([k, v]) => format(k, v)).join(""));
          if (result.summary) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, result.summary);
          process.exit(result.status);
        RUNNER_SANDBOX_FILECMD_JS: |
          // The runner's commands, as far as the sandbox may use them.
          //
          // File commands (GITHUB_OUTPUT, GITHUB_ENV, GITHUB_STATE) are parsed and
          // written back here: `name=value` lines, and the heredoc form
          //
          //   name<<DELIMITER
          //   value, possibly
          //   several lines
          //   DELIMITER
          //
          // that @actions/core writes for every value. What the sandbox wrote is
          // untrusted: names are checked, and values are written back to the
          // runner's own files with a delimiter of the writer's choosing that the
          // value can't contain, so a value can never end early and start another
          // name. Installed as /usr/local/libexec/runner-sandbox-filecmd.cjs, where
          // exec.cjs and run.cjs require it; tests/runtime/ requires it directly.
          //
          // Workflow commands are lines of a step's output that the runner acts on:
          // `::name args::data` (after leading whitespace), and the legacy
          // `##[name args]data` anywhere in a line. A sandboxed step's output is
          // the sandbox's, so CommandFilter neutralizes every command in it except
          // the annotations linters report with (`warning`, `error`, `notice`),
          // `debug`, and `group`/`endgroup`, which fold the log: they only show
          // text. The others would set outputs or state
          // behind the file commands' checks (`set-output`, `save-state`), change
          // the runner's environment, PATH or problem matchers, mask text in later
          // steps' logs, or stop command processing for the steps after it.
          // Neutralized lines stay in the log, marked.
          "use strict";
          const crypto = require("node:crypto");
          const { StringDecoder } = require("node:string_decoder");

          const NAME_RE = /^[A-Za-z_][A-Za-z0-9_-]*$/;
          const HEREDOC_RE = /^([^=<\r\n]+)<<([^\r\n]+)$/;

          // Returns [[name, value], ...] from the text of a file command; throws on
          // anything else. WHAT names the file in messages.
          function parse(text, what) {
            const lines = text.split("\n");
            if (lines.at(-1) === "") lines.pop();
            const out = [];
            for (let i = 0; i < lines.length; i++) {
              const line = lines[i].replace(/\r$/, "");
              if (line === "") continue;
              const heredoc = HEREDOC_RE.exec(line);
              let name;
              let value;
              if (heredoc) {
                name = heredoc[1];
                const delimiter = heredoc[2];
                const end = lines.findIndex((l, j) => j > i && l.replace(/\r$/, "") === delimiter);
                if (end < 0) throw new Error(`${what}: no closing ${JSON.stringify(delimiter.slice(0, 40))} for ${JSON.stringify(name.slice(0, 40))}`);
                value = lines.slice(i + 1, end).map((l) => l.replace(/\r$/, "")).join("\n");
                i = end;
              } else {
                const eq = line.indexOf("=");
                if (eq < 0) throw new Error(`${what}: refusing line ${JSON.stringify(line.slice(0, 80))}: neither name=value nor name<<DELIMITER`);
                name = line.slice(0, eq);
                value = line.slice(eq + 1);
              }
              if (!NAME_RE.test(name)) throw new Error(`${what}: invalid name ${JSON.stringify(name.slice(0, 80))}`);
              if (value.includes("\0")) throw new Error(`${what}: ${name} has a NUL byte`);
              out.push([name, value]);
            }
            return out;
          }

          // The text that sets NAME to VALUE in a file command, safe for any value.
          function format(name, value) {
            if (!NAME_RE.test(name)) throw new Error(`invalid name ${JSON.stringify(name)}`);
            if (!value.includes("\n") && !value.includes("\r")) return `${name}=${value}\n`;
            let delimiter;
            do delimiter = `ghadelimiter_${crypto.randomUUID()}`; while (value.includes(delimiter));
            return `${name}<<${delimiter}\n${value}\n${delimiter}\n`;
          }

          const ALLOWED_COMMANDS = new Set(["warning", "error", "notice", "debug", "group", "endgroup"]);
          const LEGACY_PREFIX = "##[";
          const NEUTRALIZED_LEGACY = "## [";
          const MARK = "[sandbox] ";
          // Longest stretch of one line held before it is passed on in pieces.
          const MAX_HELD = 64 * 1024;

          // LINE, one line of a sandboxed step's output, with its commands
          // neutralized. AT_START is false for the rest of a line whose start was
          // already passed on.
          function neutralize(line, atStart = true) {
            const out = line.replaceAll(LEGACY_PREFIX, NEUTRALIZED_LEGACY);
            if (!atStart) return out;
            // The runner trims what .NET calls whitespace, which includes U+0085.
            const m = /^([\s\u0085]*)::([^\s\u0085:]*)/.exec(out);
            if (!m || ALLOWED_COMMANDS.has(m[2].toLowerCase())) return out;
            return `${m[1]}${MARK}${out.slice(m[1].length)}`;
          }

          // Filters a stream of a sandboxed step's output: push() chunks as they
          // come, and end() at the end; both return what to pass on. Lines end
          // where the runner's reader ends them, at \n, \r or \r\n.
          class CommandFilter {
            constructor() {
              this.decoder = new StringDecoder("utf8");
              this.held = "";
              this.atStart = true;
            }

            push(chunk) {
              this.held += typeof chunk === "string" ? chunk : this.decoder.write(chunk);
              let out = "";
              for (;;) {
                const m = /\r\n|\r|\n/.exec(this.held);
                // A \r at the end may be the start of \r\n.
                if (!m || (m[0] === "\r" && m.index === this.held.length - 1)) break;
                out += neutralize(this.held.slice(0, m.index), this.atStart) + m[0];
                this.held = this.held.slice(m.index + m[0].length);
                this.atStart = true;
              }
              if (this.held.length > MAX_HELD) {
                // Keep the last two characters: they may begin a "##[".
                const keep = this.held.slice(-2);
                out += neutralize(this.held.slice(0, -2), this.atStart);
                this.held = keep;
                this.atStart = false;
              }
              return out;
            }

            end() {
              const rest = this.held + this.decoder.end();
              this.held = "";
              return rest === "" ? "" : neutralize(rest, this.atStart);
            }
          }

          module.exports = { parse, format, NAME_RE, neutralize, CommandFilter };
        RUNNER_SANDBOX_HANDOFF_JS: |
          // The workspace hand-off: what the enter step copies from the runner's
          // workspace into the sandbox's. install.cjs loads it (the compiler passes
          // it as RUNNER_SANDBOX_HANDOFF_JS) and runs it as root; tests/runtime/
          // requires it directly.
          //
          // The job's `handoff.workspace` picks what is copied:
          //
          //   tracked  the files git tracks (`git ls-files`), plus handoff.include
          //   all      the whole workspace
          //   none     nothing: the sandbox starts in an empty directory
          //
          // Nothing here follows a symlink: a path that goes through one is refused,
          // and a symlink inside the copied tree is copied as a symlink, which the
          // sandbox then resolves as its own user. Special files are refused. The
          // copy is refused too if it holds credentials a setup step left behind,
          // such as checkout's token with persist-credentials, or an .npmrc token.
          // Files exactly as git tracks them aren't scanned: whatever they hold was
          // committed, not left behind by the runner.
          "use strict";
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const HANDOFF_MODES = ["tracked", "all", "none"];

          // Files that hold credentials: which paths, and patterns whose first group
          // is the credential. A value that only refers to an environment variable
          // (an .npmrc's `_authToken=${NPM_TOKEN}`) is not one.
