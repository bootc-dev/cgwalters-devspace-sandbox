name: Development runner
# bot-devspace (in cgwalters-bot/homegit) finds its runs by this title, and
# the review app reads the size and duration from it.
run-name: "Devspace ${{ inputs.session_name || github.run_id }} (${{ inputs.cores }}c, ${{ inputs.duration }}m)"

on:
  workflow_dispatch:
    inputs:
      ssh_public_key:
        description: "Single-line Ed25519 public key for OpenSSH"
        type: string
        required: true
      session_name:
        description: "Safe session name used to correlate a run"
        type: string
        default: ""
        required: false
      duration:
        description: "How long to keep the runner available"
        type: choice
        options: ["30", "60", "120", "240"]
        default: "240"
        required: true
      cores:
        description: "Runner CPU cores"
        type: choice
        options: ["4", "16", "64"]
        default: "16"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: devspace-${{ github.repository }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  devspace:
    name: Ephemeral OpenSSH devspace
    runs-on: ${{ fromJSON('{"4":"rhel10-x86_64-4c-16g","16":"rhel10-x86_64-16c-64g","64":"rhel10-x86_64-64c-256g"}')[inputs.cores] }}
    timeout-minutes: 270
    steps:
      - name: Install Tailscale networking prerequisite
        shell: bash
        run: |
          set -euo pipefail
          sudo dnf install -y iptables openssh-server
          sudo ln -sfn /usr/local/bin/tailscale /usr/bin/tailscale
          sudo ln -sfn /usr/local/bin/tailscaled /usr/bin/tailscaled
          # Cockpit listens on all addresses, so other devspaces on the
          # tailnet could reach its login page; nothing here uses it.
          sudo systemctl disable --now cockpit.socket 2>/dev/null || true
          sudo systemctl stop sshd.service
          if sudo systemctl cat sshd.socket >/dev/null 2>&1; then
            sudo systemctl stop sshd.socket
          fi
          if sudo systemctl is-active --quiet sshd.service || sudo systemctl is-active --quiet sshd.socket; then
            printf '%s\n' 'refusing to join the tailnet while an SSH listener is active' >&2
            exit 1
          fi

      - name: Connect to the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:bootc-dev-sandbox
          hostname: cgwalters-devspace-${{ github.run_id }}

      - name: Install development prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm
          sudo dnf install -y git just make rsync procps-ng iproute iputils bind-utils jq tmux gh
          id runner

      - name: Check out devspace configuration
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install agent CLIs
        shell: bash
        run: |
          set -euo pipefail
          sudo dnf install -y nodejs npm
          grep -vE '^\s*(#|$)' npm.txt | xargs -r sudo npm install -g --no-audit --no-fund
          bindir="$(sudo npm prefix -g)/bin"
          for tool in opencode claude; do
            sudo -u runner -H "$bindir/$tool" --version
          done

      - name: Install the development toolchain
        shell: bash
        run: |
          set -euo pipefail
          sed -e 's/#.*//' packages.txt | xargs sudo dnf install -y

      # SSH sessions run as this user, which has no sudo; see the script.
      # It then installs the bot's dotfiles for it (just init).
      - name: Create and initialize the unprivileged runner-sandbox user
        shell: bash
        run: sudo node scripts/setup-runner-sandbox.mjs --init Justfile

      - name: Prepare OpenSSH and keep the devspace available
        shell: bash
        env:
          DURATION_MINUTES: ${{ inputs.duration }}
          SSH_PUBLIC_KEY: ${{ inputs.ssh_public_key }}
        run: |
          set -euo pipefail
          # The Tailscale login above was the one use of the OIDC request
          # token. This step lives as long as the devspace, so rerun it
          # without the token (and the runtime token, where present): its
          # /proc/PID/environ would show them to anything running as runner.
          scrub=(ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN)
          for var in "${scrub[@]}"; do
            if [[ -v "$var" ]]; then
              exec env "${scrub[@]/#/--unset=}" bash --noprofile --norc -e -o pipefail "$0"
            fi
          done
          [[ -n "$SSH_PUBLIC_KEY" && "$SSH_PUBLIC_KEY" != *$'\n'* && "$SSH_PUBLIC_KEY" != *$'\r'* ]]
          [[ "$SSH_PUBLIC_KEY" =~ ^ssh-ed25519[[:space:]]+[A-Za-z0-9+/]+={0,2}([[:space:]][^[:cntrl:]]*)?$ ]]
          [[ "$(getenforce)" == Enforcing ]]
          duration_seconds=$((DURATION_MINUTES * 60))
          config=$(mktemp)
          key_input=$(mktemp)
          # Root-owned, so the session can't add keys of its own.
          authorized_key=/etc/ssh/devspace-authorized_keys
          cleanup() {
            rm -f "$config" "$key_input"
          }
          trap cleanup EXIT INT TERM
          printf '%s\n' "$SSH_PUBLIC_KEY" >"$key_input"
          sudo ssh-keygen -lf "$key_input" >/dev/null
          sudo install -m 644 -o root -g root "$key_input" "$authorized_key"
          sudo restorecon "$authorized_key"
          sudo ssh-keygen -A
          tailscale_ip=$(sudo tailscale ip -4)
          [[ "$tailscale_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          cat >"$config" <<EOF
          Port 22
          ListenAddress $tailscale_ip
          HostKey /etc/ssh/ssh_host_ed25519_key
          AuthorizedKeysFile /etc/ssh/devspace-authorized_keys
          AuthenticationMethods publickey
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          PermitEmptyPasswords no
          AllowUsers runner-sandbox
          PermitTTY yes
          AllowAgentForwarding no
          AllowTcpForwarding no
          AllowStreamLocalForwarding no
          GatewayPorts no
          PermitTunnel no
          X11Forwarding no
          PermitUserEnvironment no
          UsePAM yes
          StrictModes yes
          EOF
          sudo install -o root -g root -m 600 "$config" /etc/ssh/sshd_config
          sudo restorecon /etc/ssh/sshd_config /etc/ssh/ssh_host_ed25519_key /etc/ssh/ssh_host_ed25519_key.pub
          sudo /usr/sbin/sshd -t
          sudo systemctl restart sshd.service
          health_check() {
            local sshd_pid context
            systemctl is-active --quiet sshd.service
            sshd_pid=$(systemctl show -p MainPID --value sshd.service)
            [[ -n "$sshd_pid" && "$sshd_pid" != 0 && -d "/proc/$sshd_pid" ]]
            context=$(ps -o label= --no-headers -p "$sshd_pid" | tr -d '[:space:]')
            [[ "$context" == *:sshd_t:* ]]
            ss -H -ltn | awk -v endpoint="${tailscale_ip}:22" '$1 == "LISTEN" && $4 ~ /:22$/ { if ($4 != endpoint) bad=1; else found=1 } END { exit (!found || bad) }'
          }
          sleep 1
          health_check
          printf 'OpenSSH is ready for runner-sandbox@%s\n' "$(hostname --fqdn)"
          printf 'Tailscale IPv4: %s\n' "$tailscale_ip"
          started=$(date +%s)
          while (( $(date +%s) - started < duration_seconds )); do
            health_check
            # tailscaled's socket is root's only (setup-runner-sandbox.mjs).
            sudo tailscale status --self
            sleep 5
          done
