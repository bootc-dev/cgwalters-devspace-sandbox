[package]
name = "bot-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Run an agent over the Agent Client Protocol, recorded and within limits"
publish = false

[dependencies]
agent-client-protocol = { version = "2.2", features = ["unstable_end_turn_token_usage"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1"

[dev-dependencies]
tempfile = "3"
