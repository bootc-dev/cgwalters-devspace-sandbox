# The ACP agents bot-harness can run (see src/agents.rs): the command that
# starts each one's ACP server on stdio, and how it's told the model.
# opencode and Claude Code's ACP adapter are pinned in npm.txt; agent.yml
# installs the one it runs, with its launcher, and gives it inference from
# the praxis broker (opencode with homegit's dotfiles/.config/opencode, see
# agent/opencode-config.mjs; Claude Code with agent/claude-config.mjs). No
# secrets here: behind a wrapper, `env` is passed on the command line
# (env K=V ...), which other users can see.

# Claude Code, through its ACP adapter (@agentclientprotocol/claude-agent-acp).
# The launcher clears inherited ANTHROPIC_* and CLAUDE_* but the model, and
# sets the run's environment (the broker and the run token) from the file
# agent.yml wrote; without that file it refuses to start, rather than have
# Claude Code look for a login. agent.yml installs it. Opus unless the run
# names a model.
#
# No `notices`: the adapter queues a prompt sent during a turn as a turn of
# its own, and when Claude Code takes it up answers the running one with
# end_turn, which would end the run as done. Its `_session/steering`
# request is what would deliver one inside the turn.
[claude]
command = ["node", "/usr/local/bin/claude-launch.mjs"]
model-env = "ANTHROPIC_MODEL"
env = { ANTHROPIC_MODEL = "opus" }

# opencode speaks ACP natively; its model is a session config option. Its
# providers come only from the global configuration agent/praxis.mjs
# writes: not from the target repository's opencode.json or .opencode/
# (which could add providers or plugins), nor fetched from models.dev. The
# same switch also stops opencode loading the repository's AGENTS.md and
# CLAUDE.md as instructions, so run.mjs points the prompt at them instead.
# The repository's skills (.claude/skills, .agents/skills) still load: like
# AGENTS.md they are only text for the model, and
# OPENCODE_DISABLE_EXTERNAL_SKILLS would drop the project's own guidance
# without adding a boundary.
[opencode]
# The launcher clears inherited OPENCODE_* and XDG base directories before
# restoring the deliberate disable controls and selecting the optional
# installed profile. agent.yml installs it.
command = ["node", "/usr/local/bin/opencode-launch.mjs"]
# A prompt sent during a turn reaches the model at its next step.
notices = true

# A scripted agent with no model behind it (src/bin/fake-acp-agent.rs),
# for runs without inference: it plays fake-agent-demo.json.
[fake]
command = ["fake-acp-agent", "demo"]
notices = true
