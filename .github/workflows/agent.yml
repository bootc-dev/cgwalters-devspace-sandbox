name: Agent run
run-name: "agent ${{ inputs.item }} ${{ inputs.repo }}"

# One agent working one board item as the unprivileged runner-sandbox user,
# driven over the Agent Client Protocol by bot-harness (harness/), with its
# condensed transcript in this job's log and the full one in artifacts.
# The inputs, artifacts and summary.json follow docs/devspace-agent-runs.md
# in cgwalters-bot/homegit; bot-runs there dispatches and reads these runs.
# The agents are the scripted fake one (harness/src/bin/fake-acp-agent.rs),
# which needs no inference, and opencode, which gets it from the praxis
# credential broker on the tailnet (vars.PRAXIS_BASE_URL). The broker holds
# the subscription login, so no model credential reaches this runner; the
# only credential the job uses is its OIDC token, for the tailnet login.
on:
  # Spike only: lets GitHub learn this workflow on a non-default branch.
  push:
    branches: [bot/agent-run-praxis]
    paths: [.github/workflows/agent.yml]
  workflow_dispatch:
    inputs:
      item:
        description: "Board item id (PVTI_...)"
        type: string
        required: true
      repo:
        description: "Target repository, OWNER/REPO"
        type: string
        required: true
      base:
        description: "Base ref of the target repository"
        type: string
        default: main
      # An entry in harness/agents.toml. claude joins once the broker
      # can hold its credential too.
      agent:
        description: "Agent"
        type: choice
        options: ["fake", "opencode"]
        default: fake
      model:
        description: "Model, as provider/model (empty: the agent's default; for opencode, the one in homegit's configuration)"
        type: string
        default: ""
      # opencode's configuration (providers, model, instructions) is the
      # bot's own, dotfiles/.config/opencode in its homegit, which
      # bot-opencode uses locally too. Public, like the target.
      homegit:
        description: "Repository, OWNER/REPO, whose dotfiles/.config/opencode configures opencode"
        type: string
        default: cgwalters-bot/homegit
      homegit_ref:
        description: "Branch, tag or commit of that repository"
        type: string
        default: main
      cores:
        description: "Runner CPU cores"
        type: choice
        options: ["4", "16", "64"]
        default: "4"
      timeout:
        description: "Minutes the agent may run (at most 330)"
        type: string
        default: "120"
      budget:
        description: "Spend cap in AIC (1 AIC = $0.01)"
        type: string
        default: "500"
      workflow:
        description: "What the item wants"
        type: choice
        options: ["branch", "analysis"]
        default: branch
      brief:
        description: "The task text (public: no private data)"
        type: string
        required: true

permissions:
  contents: read
  # Only for the tailnet login, as in devspace.yml: the OAuth client trusts
  # this job's OIDC tokens. runner-sandbox can't read the step
  # environments that hold the request token (the isolation check).
  id-token: write

concurrency:
  group: agent-${{ inputs.item }}
  cancel-in-progress: false

jobs:
  agent:
    name: Agent
    runs-on: ${{ fromJSON('{"4":"rhel10-x86_64-4c-16g","16":"rhel10-x86_64-16c-64g","64":"rhel10-x86_64-64c-256g"}')[inputs.cores] }}
    timeout-minutes: 360
    env:
      # The Rust the agent builds with, installed with rustup (the same
      # for every target; one with its own rust-toolchain.toml gets that
      # one, downloaded by rustup). Bump by hand, which also renews the cache.
      RUST_TOOLCHAIN: "1.99.0"
      # The broker's URL on the tailnet, http://<tailnet IPv4>:<port>/v1.
      # Not a secret; unused by the fake agent.
      PRAXIS_BASE_URL: ${{ inputs.agent != 'fake' && vars.PRAXIS_BASE_URL || '' }}
    steps:
      - name: Check the inputs
        shell: bash
        env:
          TIMEOUT: ${{ inputs.timeout }}
          BUDGET: ${{ inputs.budget }}
          AGENT: ${{ inputs.agent }}
          HOMEGIT: ${{ inputs.homegit }}
          HOMEGIT_REF: ${{ inputs.homegit_ref }}
        run: |
          set -euo pipefail
          if ! [[ "$TIMEOUT" =~ ^[1-9][0-9]{0,2}$ ]] || (( TIMEOUT > 330 )); then
            echo "::error::timeout must be 1-330 minutes, not '$TIMEOUT'"
            exit 1
          fi
          if ! [[ "$BUDGET" =~ ^(0|[1-9][0-9]{0,5})(\.[0-9]+)?$ ]]; then
            echo "::error::budget must be a number of AIC, not '$BUDGET'"
            exit 1
          fi
          if ! [[ "$HOMEGIT" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::homegit must be OWNER/REPO, not '$HOMEGIT'"
            exit 1
          fi
          if ! [[ "$HOMEGIT_REF" =~ ^[A-Za-z0-9_][A-Za-z0-9_./-]{0,199}$ ]] || [[ "$HOMEGIT_REF" == *..* ]]; then
            echo "::error::homegit_ref must be a branch, tag or commit, not '$HOMEGIT_REF'"
            exit 1
          fi
          if [[ "$AGENT" != fake && -z "$PRAXIS_BASE_URL" ]]; then
            echo "::error::agent $AGENT needs the PRAXIS_BASE_URL repository variable (the praxis broker on the tailnet)"
            exit 1
          fi

      - name: Check out agent configuration
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo dnf install -y git curl zstd podman nodejs npm cargo

      - name: Install opencode
        if: ${{ inputs.agent == 'opencode' }}
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^opencode-ai@' npm.txt | xargs sudo npm install -g --no-audit --no-fund
          opencode --version

      # As in devspace.yml: nothing may listen on the tailnet once the
      # runner joins it, and the action installs into /usr/local/bin, which
      # isn't in sudo's PATH on RHEL.
      - name: Install Tailscale networking prerequisite
        if: ${{ inputs.agent != 'fake' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo dnf install -y iptables
          sudo ln -sfn /usr/local/bin/tailscale /usr/bin/tailscale
          sudo ln -sfn /usr/local/bin/tailscaled /usr/bin/tailscaled
          # Cockpit listens on all addresses; nothing here uses it or sshd.
          sudo systemctl disable --now cockpit.socket 2>/dev/null || true
          sudo systemctl stop sshd.service
          if sudo systemctl cat sshd.socket >/dev/null 2>&1; then
            sudo systemctl stop sshd.socket
          fi
          if sudo systemctl is-active --quiet sshd.service || sudo systemctl is-active --quiet sshd.socket; then
            printf '%s\n' 'refusing to join the tailnet while an SSH listener is active' >&2
            exit 1
          fi

      # Only the praxis broker is used there: setup-runner-sandbox.mjs keeps
      # runner-sandbox off the rest of the tailnet.
      - name: Connect to the tailnet
        if: ${{ inputs.agent != 'fake' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:bootc-dev-sandbox
          hostname: cgwalters-agent-${{ github.run_id }}
          # MagicDNS answers PTR queries for every node; the broker is
          # reached by address, and everything else by the runner's DNS.
          args: --accept-dns=false

      # tailscaled's LocalAPI socket is 0666 and would dial the tailnet for
      # anyone; setup-runner-sandbox.mjs does this too, but don't leave it
      # open in between.
      - name: Close tailscaled's LocalAPI to other users
        if: ${{ inputs.agent != 'fake' }}
        shell: bash
        run: sudo chmod 0700 /var/run/tailscale

      # Logs and transcripts are public, so private repositories are refused
      # (as they are by bot-runs dispatch), before anything is cloned.
      - name: Check that the target repository is public
        shell: bash
        env:
          REPO: ${{ inputs.repo }}
          HOMEGIT: ${{ inputs.homegit }}
          AGENT: ${{ inputs.agent }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/public-repo.mjs "$REPO"
          if [[ "$AGENT" == opencode ]]; then
            node scripts/public-repo.mjs "$HOMEGIT"
          fi

      # Read-only input to run.mjs, which copies only dotfiles/.config/opencode
      # to runner-sandbox: the rest of the checkout stays runner's.
      - name: Check out homegit for the agent's configuration
        if: ${{ inputs.agent == 'opencode' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.homegit }}
          ref: ${{ inputs.homegit_ref }}
          path: homegit
          persist-credentials: false

      # bot-harness runs as runner, from the checkout. The agent runs as
      # runner-sandbox, which can't read runner's home, so the fake agent
      # goes where its PATH finds it.
      - name: Build bot-harness
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p bot-harness
          sudo install -m 0755 target/release/fake-acp-agent /usr/local/bin/

      # What bootc and composefs-rs-sized targets need to build and test
      # without the agent installing anything (runner-sandbox has no sudo):
      # compilers, the C libraries their crates link, and podman.
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make cmake pkgconf-pkg-config perl-core \
            openssl-devel libzstd-devel clang clang-devel \
            ostree-devel glib2-devel libselinux-devel systemd-devel \
            podman buildah skopeo

      # rustup, system-wide, so that runner-sandbox finds the toolchain
      # (RUSTUP_HOME, see scripts/runner-sandbox.mjs) but keeps its own
      # CARGO_HOME. Cached; saved before the agent runs, so nothing it does
      # ends up in the cache.
      - name: Prepare the Rust toolchain directories
        shell: bash
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/rustup /opt/cargo

      - name: Restore the Rust toolchain cache
        id: rust-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            /opt/rustup
            /opt/cargo
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}

      - name: Install the Rust toolchain
        if: ${{ steps.rust-cache.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          RUSTUP_HOME: /opt/rustup
          CARGO_HOME: /opt/cargo
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          /opt/cargo/bin/rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          /opt/cargo/bin/rustup default "$RUST_TOOLCHAIN"

      - name: Save the Rust toolchain cache
        if: ${{ steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            /opt/rustup
            /opt/cargo
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      # rustup's proxies, ahead of the dnf cargo on runner-sandbox's PATH.
      - name: Put the Rust toolchain on the PATH
        shell: bash
        run: |
          set -euo pipefail
          for tool in cargo rustc rustdoc rustfmt cargo-fmt cargo-clippy clippy-driver rustup; do
            sudo ln -sfn /opt/cargo/bin/rustup "/usr/local/bin/$tool"
          done
          sudo chmod -R a+rX /opt/cargo

      - name: Create the unprivileged runner-sandbox user
        shell: bash
        run: sudo node scripts/setup-runner-sandbox.mjs ${PRAXIS_BASE_URL:+--tailnet-allow "$PRAXIS_BASE_URL"}

      # Its own, so that a target's rust-toolchain.toml can add a toolchain.
      - name: Give runner-sandbox the Rust toolchain
        shell: bash
        run: sudo chown -R runner-sandbox:runner-sandbox /opt/rustup

      - name: Check the runner-sandbox user's isolation
        shell: bash
        run: node scripts/agent-isolation-check.mjs ${PRAXIS_BASE_URL:+--tailnet-allow "$PRAXIS_BASE_URL"} https://github.com/

      - name: Run the agent
        id: agent
        shell: bash
        timeout-minutes: 340
        env:
          ITEM: ${{ inputs.item }}
          REPO: ${{ inputs.repo }}
          BASE: ${{ inputs.base }}
          AGENT: ${{ inputs.agent }}
          MODEL: ${{ inputs.model }}
          CORES: ${{ inputs.cores }}
          TIMEOUT_MINUTES: ${{ inputs.timeout }}
          BUDGET: ${{ inputs.budget }}
          WORKFLOW: ${{ inputs.workflow }}
          BRIEF: ${{ inputs.brief }}
          HOMEGIT_DIR: ${{ github.workspace }}/homegit
          OUT: ${{ runner.temp }}/agent
        run: node agent/run.mjs

      # Nothing is uploaded unless this passes, even when the agent failed:
      # the target is still public, and nothing secret-shaped is left.
      - name: Check the uploads
        id: uploads
        if: ${{ !cancelled() }}
        shell: bash
        env:
          REPO: ${{ inputs.repo }}
          AGENT: ${{ inputs.agent }}
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/agent
        run: node scripts/check-uploads.mjs "$OUT" "$REPO"

      - name: Upload the run summary
        if: ${{ !cancelled() && steps.uploads.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-run
          path: ${{ runner.temp }}/agent/run/
          retention-days: 90
          if-no-files-found: error

      - name: Upload the transcript
        if: ${{ !cancelled() && steps.uploads.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-transcript
          path: ${{ runner.temp }}/agent/transcript.tar.zst
          retention-days: 30
          if-no-files-found: error

      # A branch run's change (changes.patch, base.json), for bot-runs apply.
      - name: Upload the change
        if: ${{ !cancelled() && steps.uploads.outcome == 'success' && inputs.workflow == 'branch' }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-out
          path: ${{ runner.temp }}/agent/agent-out/
          retention-days: 30
          if-no-files-found: ignore
