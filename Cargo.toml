[package]
name = "devspace"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Manage disposable development runners"
repository = "https://github.com/bootc-dev/cgwalters-devspace-sandbox"
publish = false

[[bin]]
name = "devspace"
path = "devspace.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xshell = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
serde_yaml = "0.9"
