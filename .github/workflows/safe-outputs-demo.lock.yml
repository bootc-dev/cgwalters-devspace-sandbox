            if (!/^[A-Za-z0-9_-]+$/.test(name ?? "")) throw new Error(`invalid stage name ${JSON.stringify(name)}`);
            if (typeof rel !== "string" || rel === "" || path.isAbsolute(rel) || rel.split("/").some((c) => c === ".." || c === "")) {
